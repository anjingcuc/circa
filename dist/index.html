<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self' blob:; img-src 'self' data:; connect-src ipc: http://ipc.localhost">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- data-tauri-drag-region makes the circle draggable; the controls inside
       don't carry the attribute so buttons keep their clicks. -->
  <div id="container" data-tauri-drag-region>
    <video id="cam" autoplay playsinline muted data-tauri-drag-region></video>
    <div id="ring"></div>
    <div id="controls">
      <select id="camSelect" title="Camera"></select>
      <button id="clickThroughBtn" title="Click-through (Ctrl+Shift+C)">👆</button>
      <button id="minimizeBtn" title="Minimize">—</button>
      <button id="closeBtn" title="Close">✕</button>
    </div>
    <div id="hint">scroll to resize • drag to move</div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
