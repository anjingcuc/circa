<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self' blob:; img-src 'self' data:; connect-src ipc: http://ipc.localhost">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- data-tauri-drag-region 使圆形区域可整体拖拽；内部控制条不带该属性，
       按钮因此仍能正常接收点击。 -->
  <div id="container" data-tauri-drag-region>
    <video id="cam" autoplay playsinline muted data-tauri-drag-region></video>
    <div id="ring"></div>
    <div id="controls">
      <select id="camSelect" title="摄像头"></select>
      <button id="clickThroughBtn" title="点击穿透（Ctrl+Shift+C）">👆</button>
      <button id="minimizeBtn" title="最小化">—</button>
      <button id="closeBtn" title="关闭">✕</button>
    </div>
    <div id="hint">滚轮缩放 • 拖拽移动</div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
